name: GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # nightly at 6:00 UTC

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y pngcrush
          npm install
          pip install -r tools/requirements-build_docs.txt

      - name: Build
        run: |
          npm run build

      - name: Install mdbook
        env:
          MDBOOK_REV: "2ea30c00f00647d2b3f4c0f79b3e0e1eabc0b66d"  # v0.5.4
          MDBOOK_MERMAID_REV: "99e2393a739f3c36fde30c59317d4daa355eefaf"  # v0.17.1
          MDBOOK_PLANTUML_REV: "dae70cfd3deb8438127cc369a92ecefe24acb6a2"  # v2.0.0
        run: |
          cargo install --locked --root $HOME/.local --git https://github.com/rust-lang/mdBook --rev "${MDBOOK_REV}" mdbook
          cargo install --locked --root $HOME/.local --git https://github.com/badboy/mdbook-mermaid --rev "${MDBOOK_MERMAID_REV}" mdbook-mermaid
          cargo install --locked --root $HOME/.local --git https://github.com/sytsereitsma/mdbook-plantuml --rev "${MDBOOK_PLANTUML_REV}" mdbook-plantuml --no-default-features
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build docs
        run: |
          python tools/build_docs.py --output book --verbose

      - name: Copy docs into dist
        run: cp -r book/* dist/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
